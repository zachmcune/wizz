name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run test:slow

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # ------------------------------------------------------------------ v2 (rebuild)
  #
  # The v2 rebuild has its own package.json, tsconfig, eslint config, vitest config and Vite build. It
  # was NOT covered by the v1 jobs above, which means v2's ~400 tests and its production build were
  # never verified in CI — they only ever ran locally. This job closes that gap.
  #
  # It builds as well as tests, because several v2 failures only surface in the production bundle:
  # `gallery.html`, `styleguide.html` and `ui-proof.html` are separate Vite entries, and a missing
  # entry or an unbundled `public/` asset succeeds in dev and 404s only when built.
  v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci
      - name: Install the Chromium the UI gates drive
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: "Lint (includes the UI style rules: no hard-coded colours, no purple chrome)"
        run: npm run lint
      # The Phase 4 gates measure REAL rendered layout: HUD area, overlap between HUD zones, the Place
      # button being topmost, .hud-cmd height, and unit separation. They need the app served, so Vite is
      # started in the background and its port is handed to the tests through PROOF_BASE.
      - name: Start the dev server
        run: |
          npx vite --host 127.0.0.1 --port 5343 --strictPort > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5343/app.html; then echo "vite up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "vite failed to start"; cat /tmp/vite.log; exit 1
      # The simulation perf gate measures WALL-CLOCK, so it must not share a CPU with six Playwright
      # browser sessions — it measured 114.8x against a 90x ceiling purely from contention, while the
      # same code measures 42-48x on a quiet machine. Running it first, alone, gives a number that
      # actually means something.
      - name: Sim performance gate (isolated, no browser running)
        run: npx vitest run tests/sim/perf.test.ts
      # THE AI SMOKE TOURNAMENT.
      #
      # The full Phase 5 bracket is 12 seeds x 2 sides x 4 matchups = 96 matches and runs hours of CPU; its committed result
      # is checked by tests/phase5-tournament.test.ts instead. This runs 4 SHORT matches on every push and asserts the
      # properties that must hold for any match at all: every match terminates, no side stalls, an army is never left idle,
      # and the same seed reproduces the same state hash.
      #
      # It is deliberately NOT a balance measurement -- four matches cannot establish a win rate -- and it is kept isolated
      # from the browser jobs so the timing-free assertions stay meaningful.
      - name: AI smoke tournament (termination, stalls, determinism)
        run: npx vite-node audit/ai-smoke.ts
      # THE SLOW AI SUITES RUN FIRST, ALONE, BEFORE ANY BROWSER OPENS.
      #
      # These are long CPU-bound simulation suites: the fairness test plays 12 mirror matches in each of two cases, and the team
      # suites play a 2v2 and a four-player free-for-all. Run in the same process pool as fourteen Playwright sessions they
      # starved the browser of CPU, and `page.goto` hit its 30-second timeout — a failure that was intermittent (the same
      # commit passed and failed on different runs), reported a navigation timeout rather than an assertion, and had nothing to
      # do with the UI being tested. Ordering them first makes the browser gates measure the UI in a quiet environment.
      - name: Slow AI suites (fairness, teams) — isolated, no browser running
        run: npm run test:slow-ai
      # THE SLOW MULTIPLAYER SUITES. Phase 6's lockstep tests drive 2-4 full headless matches through the relay,
      # injecting latency, jitter, drops and a deliberate desync. Together they are ~25 minutes of CPU and are
      # excluded from `test:unit` for exactly the reason the slow AI suites are: run alongside the browser gates
      # they would starve the page loads and produce navigation timeouts that look like product failures.
      - name: Slow multiplayer suites (lockstep through the relay, desync, jitter, rejoin)
        run: npm run test:slow-net
      # Everything EXCEPT the perf gate (already run alone above) and the slow AI suites (just run). Re-running them here would
      # measure them under browser contention and produce a meaningless number.
      - name: Unit and proof tests (including the live UI gates)
        run: npm run test:unit
        env:
          PROOF_BASE: http://127.0.0.1:5343
      - name: Stop the dev server
        if: always()
        run: kill "$(cat /tmp/vite.pid)" 2>/dev/null || true
      - name: Production build
        run: npm run build
      - name: Assert every deployed entry and font exists in the build output
        run: |
          set -e
          for f in dist/index.html dist/gallery.html dist/styleguide.html dist/ui-proof.html dist/app.html; do
            test -f "$f" || { echo "missing build entry: $f"; exit 1; }
          done
          test -f dist/atlas-final/units.json || { echo "missing atlas manifest"; exit 1; }
          ls dist/fonts/*.woff2 >/dev/null 2>&1 || { echo "missing self-hosted fonts"; exit 1; }
          echo "all entries, atlas and fonts present"
